# Runs the checks listed in .github/project.json (see docs/project-config.md in ba6ul/.github).
name: ci

on:
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    uses: ba6ul/.github/.github/workflows/ci.yml@v1

  # The daemon is Windows-first (route print, process handling), so run the
  # same checks there as well. The job above keeps its name and runner.
  ci-windows:
    uses: ba6ul/.github/.github/workflows/ci.yml@v1
    with:
      runner: windows-latest
